plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Unit-Tests laufen in der NeoForge-Laufzeit (FML), damit der Welt-Speicher echt geprüft werden kann (Issue #7).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


tasks.named('test') {
    useJUnitPlatform()
    // Quelltextwurzel für die Architekturprüfung des Kerns (Arbeitsverzeichnis der Unit-Test-Umgebung ist nicht das Projekt).
    systemProperty 'idle_realms.sourceRoot', file('src/main/java').absolutePath
}

tasks.named('processResources') {
    def props = [version: mod_version, mod_id: mod_id, neo_version: neo_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
