plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Unit-Tests laufen in der NeoForge-Laufzeit (FML), damit der Welt-Speicher echt geprüft werden kann (Issue #7).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}


tasks.named('test') {
    useJUnitPlatform()
    // Quelltextwurzel für die Architekturprüfung des Kerns (Arbeitsverzeichnis der Unit-Test-Umgebung ist nicht das Projekt).
    systemProperty 'idle_realms.sourceRoot', file('src/main/java').absolutePath
}

tasks.named('processResources') {
    def props = [version: mod_version, mod_id: mod_id, neo_version: neo_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

// Prozessneustart (Issue #7): Schreib- und Lesephase laufen in getrennten JVMs auf demselben Weltordner.
// Der Einstieg ist der JUnit-Konsolenstarter; er öffnet die JUnit-Sitzung, in der die NeoForge-Laufzeit startet.
configurations {
    restartLauncher
}
dependencies {
    restartLauncher platform('org.junit:junit-bom:5.14.0')
    restartLauncher 'org.junit.platform:junit-platform-console-standalone:1.14.0'
}
def restartDir = layout.buildDirectory.dir('process-restart')
def restartPhase = { String phase, def before ->
    return tasks.register("processRestart${phase.capitalize()}", JavaExec) {
        dependsOn 'testClasses', 'prepareNeoForgeTestFiles'
        if (before) dependsOn before
        classpath = configurations.restartLauncher + tasks.named('test').get().classpath
        jvmArgs = tasks.named('test').get().allJvmArgs
        mainClass = 'org.junit.platform.console.ConsoleLauncher'
        args '--select-method', "idle_realms.server.ProcessRestartTest#${phase}Phase", '--fail-if-no-tests'
        systemProperty 'idle_realms.phase', phase
        systemProperty 'idle_realms.world', restartDir.get().asFile.absolutePath
        if (phase == 'write') {
            doFirst { restartDir.get().asFile.deleteDir() }
        }
    }
}
def restartWrite = restartPhase('write', null)
def restartRead = restartPhase('read', restartWrite)
tasks.named('check') {
    dependsOn restartRead
}
