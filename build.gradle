plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Der Plattform-Codec des Speicherplatzes wird gegen Minecraft geprüft (Issue #7).
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processResources') {
    def props = [version: mod_version, mod_id: mod_id, neo_version: neo_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
